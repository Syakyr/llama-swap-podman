# Local development / deployment compose. The image is the wrapped
# llama-swap + podman-remote built by .github/workflows/build.yml;
# `podman compose up` here rebuilds it locally from the same Dockerfile.
#
# Requires the user podman socket at /run/user/1000/podman/podman.sock
# (systemctl --user start podman.socket).
services:
  llama-swap:
    build:
      context: .
      args:
        LLAMA_SWAP_IMAGE: ${LLAMA_SWAP_IMAGE:-ghcr.io/mostlygeek/llama-swap:v256-cpu-b11058}
        PODMAN_VERSION: ${PODMAN_VERSION:-6.1.2}
    image: llama-swap-podman:local
    network_mode: host
    environment:
      - CONTAINER_HOST=unix:///podman.sock
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./llama-swap-data:/data/llama-swap
      - /run/user/1000/podman/podman.sock:/podman.sock
    restart: unless-stopped
    command:
      - "--config"
      - "/app/config.yaml"
      - "--listen"
      - "0.0.0.0:8080"
      - "--watch-config"
