# Local development / deployment compose. The image is the llama-swap
# aggregator built by .github/workflows/build.yml; `podman compose up --build`
# here rebuilds it locally from the same Dockerfile.
#
# Requires the user podman socket at /run/user/1000/podman/podman.sock
# (systemctl --user start podman.socket).
#
# The pins below are the sha256 of each upstream release asset, kept fresh by
# the watch-llama-swap workflow. Resolve them by hand with:
#
#   uv run scripts/resolve_release.py                 # newest of both upstreams
#   uv run scripts/resolve_release.py v258 6.1.2 --field ls_sha256
services:
  llama-swap:
    build:
      context: .
      args:
        LS_VERSION: ${LS_VERSION:-258}
        LS_SHA256: ${LS_SHA256:-cb1f9a94be05afa129d3c17868f1dd2ca710b919333c7b868239dc31575dcfa1}
        PODMAN_VERSION: ${PODMAN_VERSION:-6.1.4}
        PODMAN_SHA256: ${PODMAN_SHA256:-af1f85c22214088a0a9986b9c82b4c9b5b74eda8ecaa6c8cca82b1a63f339b4a}
    image: llama-swap-podman:local
    network_mode: host
    environment:
      # seam: point the baked-in podman-remote at the host socket mounted below
      - CONTAINER_HOST=unix:///podman.sock
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./llama-swap-data:/data/llama-swap
      - /run/user/1000/podman/podman.sock:/podman.sock
    restart: unless-stopped
    # The image's own CMD is `-config /app/config.yaml -watch-config`; a
    # compose `command:` replaces it outright (it no longer appends to a
    # flag-carrying ENTRYPOINT, so flags are not duplicated).
    command:
      - "-config"
      - "/app/config.yaml"
      - "-listen"
      - "0.0.0.0:8080"
      - "-watch-config"
    # The image ships its own HEALTHCHECK (/app/healthcheck). Uncomment to
    # watch it:
    #   watch -n5 "podman inspect -f '{{.State.Health.Status}}' llama-swap-podman-local"
