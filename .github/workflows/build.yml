name: build

# Builds the llama-swap aggregator image (upstream release binary +
# podman-remote, on scratch) and publishes it to GHCR.
#
# Three modes, picked from the event:
#
#   release  tag push v<llama-swap>-podman<X.Y.Z>
#              -> :v258-podman6.1.2   immutable pairing record
#              -> :v258                latest build of that llama-swap version
#              -> :latest              only when v258 is the newest upstream release
#   dev      push to main or feat/**
#              -> :dev                 rolling, for testing before a release
#              -> :dev-<shortsha>     the exact build you tested
#   test     pull_request (and dispatch with mode=test)
#              -> builds and smoke-tests, pushes nothing
#
# Nothing is baked from a floating tag: both release assets are pinned by
# sha256, resolved from the checksums each upstream publishes (or passed in
# explicitly on a dispatch) and recorded in the image labels and job summary.

on:
  push:
    tags: ["v[p0-9]*-podman[0-9]*"]
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      llama_swap_version:
        description: "Upstream llama-swap version (blank = newest release)"
        required: false
        default: ""
      podman_version:
        description: "Podman version for the baked-in remote CLI (blank = newest stable)"
        required: false
        default: ""
      ls_sha256:
        description: "Optional sha256 override for the llama-swap tarball"
        required: false
        default: ""
      podman_sha256:
        description: "Optional sha256 override for the podman-remote tarball"
        required: false
        default: ""
      mode:
        description: "Publish mode"
        type: choice
        options: [auto, release, dev, test]
        default: auto

env:
  REGISTRY: ghcr.io
  # Uncompressed size ceiling. The runtime is llama-swap (~43 MB) +
  # podman-remote (~47 MB) + CA bundle + healthcheck (~6 MB) ≈ 96 MB. A jump
  # past this means something heavy crept into the image.
  SIZE_LIMIT_BYTES: 130000000

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: scripts/**

      - name: Resolve versions and checksums
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          IN_MODE: ${{ inputs.mode }}
          IN_LS: ${{ inputs.llama_swap_version }}
          IN_PODMAN: ${{ inputs.podman_version }}
          IN_LS_SHA: ${{ inputs.ls_sha256 }}
          IN_PODMAN_SHA: ${{ inputs.podman_sha256 }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            push)
              if [ "$REF_TYPE" = "tag" ]; then MODE=release; else MODE=dev; fi ;;
            pull_request) MODE=test ;;
            workflow_dispatch)
              MODE="${IN_MODE:-auto}"
              [ "$MODE" = "auto" ] && MODE=dev ;;
            *) MODE=test ;;
          esac

          # Versions come from inputs by default. A tag push overrides them with
          # the tag itself, because the tag IS the provenance record. A
          # workflow_dispatch with mode=release runs on a branch ref, so it
          # must carry both versions as inputs (the watcher always does).
          LS="${IN_LS:-}"
          PODMAN="${IN_PODMAN:-}"
          PAIR_TAG=""
          if [ "$MODE" = "release" ] && [ "$REF_TYPE" = "tag" ]; then
            LS="${REF_NAME%%-podman*}"
            PODMAN="${REF_NAME##*-podman}"
            # The tag itself is the immutable record, so a retried release can
            # carry a trailing -N suffix and still publish a distinct image tag
            # rather than overwriting the pairing it collides with. The podman
            # version underneath is still X.Y.Z.
            PAIR_TAG="$REF_NAME"
            PODMAN="${PODMAN%%-[0-9]*}"
          fi

          LS="v${LS#v}"
          if [ "$LS" = "v" ]; then
            if [ "$MODE" = "release" ]; then
              echo "::error::release mode needs llama_swap_version (a branch ref carries no version)"
              exit 1
            fi
            LS="v$(uv run scripts/resolve_release.py --field ls_version)"
          fi
          if [ -z "$PODMAN" ]; then
            if [ "$MODE" = "release" ]; then
              echo "::error::release mode needs podman_version (a branch ref carries no version)"
              exit 1
            fi
            PODMAN="$(uv run scripts/resolve_release.py "$LS" --field podman_version)"
          fi

          # Refuse a malformed pairing before spending requests on checksums.
          if ! printf '%s' "${LS#v}" | grep -Eq '^[0-9]+$'; then
            echo "::error::llama-swap version '${LS}' is not v<digits>"
            exit 1
          fi
          if ! printf '%s' "$PODMAN" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::podman version '${PODMAN}' is not X.Y.Z"
            exit 1
          fi

          LS_SHA="${IN_LS_SHA:-}"
          PODMAN_SHA="${IN_PODMAN_SHA:-}"
          if [ -z "$LS_SHA" ]; then
            LS_SHA="$(uv run scripts/resolve_release.py "$LS" "$PODMAN" --field ls_sha256)"
          fi
          if [ -z "$PODMAN_SHA" ]; then
            PODMAN_SHA="$(uv run scripts/resolve_release.py "$LS" "$PODMAN" --field podman_sha256)"
          fi

          for pair in "llama-swap:$LS_SHA" "podman:$PODMAN_SHA"; do
            if ! printf '%s' "${pair#*:}" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error::${pair%%:*} sha256 '${pair#*:}' is not 64 hex chars"
              exit 1
            fi
          done

          IS_LATEST=no
          if [ "$MODE" = "release" ]; then
            NEWEST="$(uv run scripts/resolve_release.py --field ls_version)"
            [ "${LS#v}" = "$NEWEST" ] && IS_LATEST=yes
          fi

          IMAGE="$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          SHORT="${SHA:0:7}"

          # A dispatch-driven release has no tag of its own; compose the
          # canonical pairing name.
          if [ -z "$PAIR_TAG" ] && [ "$MODE" = "release" ]; then
            PAIR_TAG="${LS}-podman${PODMAN}"
          fi

          {
            echo "mode=$MODE"
            echo "llama_swap=$LS"
            echo "ls_num=${LS#v}"
            echo "podman=$PODMAN"
            echo "pair_tag=$PAIR_TAG"
            echo "ls_sha256=$LS_SHA"
            echo "podman_sha256=$PODMAN_SHA"
            echo "is_latest=$IS_LATEST"
            echo "image=$IMAGE"
            echo "short_sha=$SHORT"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Image plan"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| mode | \`$MODE\` |"
            echo "| immutable image tag | \`${PAIR_TAG:-n/a}\` |"
            echo "| llama-swap | \`$LS\` |"
            echo "| llama-swap sha256 | \`$LS_SHA\` |"
            echo "| podman-remote | \`$PODMAN\` |"
            echo "| podman-remote sha256 | \`$PODMAN_SHA\` |"
            echo "| newest upstream | \`$([ "$IS_LATEST" = yes ] && echo yes || echo no)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - name: Smoke build (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          build-args: |
            LS_VERSION=${{ steps.ver.outputs.ls_num }}
            LS_SHA256=${{ steps.ver.outputs.ls_sha256 }}
            PODMAN_VERSION=${{ steps.ver.outputs.podman }}
            PODMAN_SHA256=${{ steps.ver.outputs.podman_sha256 }}
          tags: llama-swap-podman:smoke
          cache-from: type=gha,scope=image-${{ steps.ver.outputs.llama_swap }}
          cache-to: type=gha,scope=image-${{ steps.ver.outputs.llama_swap }},mode=max

      - name: Smoke test
        run: |
          ./scripts/smoke_test.sh llama-swap-podman:smoke \
            "${{ steps.ver.outputs.llama_swap }}" \
            "${{ steps.ver.outputs.podman }}"

      - name: Size budget
        run: |
          set -euo pipefail
          size="$(docker image inspect -f '{{.Size}}' llama-swap-podman:smoke)"
          echo "uncompressed image size: $size bytes"
          if [ "$size" -gt "$SIZE_LIMIT_BYTES" ]; then
            echo "::error::image is $size bytes, over the $SIZE_LIMIT_BYTES budget"
            exit 1
          fi
          echo "- image size: \`$size\` bytes (budget \`$SIZE_LIMIT_BYTES\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        if: steps.ver.outputs.mode != 'test'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push (release)
        if: steps.ver.outputs.mode == 'release'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            LS_VERSION=${{ steps.ver.outputs.ls_num }}
            LS_SHA256=${{ steps.ver.outputs.ls_sha256 }}
            PODMAN_VERSION=${{ steps.ver.outputs.podman }}
            PODMAN_SHA256=${{ steps.ver.outputs.podman_sha256 }}
          tags: |
            ghcr.io/${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.pair_tag }}
            ghcr.io/${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.llama_swap }}
            ${{ steps.ver.outputs.is_latest == 'yes' && format('ghcr.io/{0}:latest', steps.ver.outputs.image) || '' }}
          cache-from: type=gha,scope=image-${{ steps.ver.outputs.llama_swap }}
          cache-to: type=gha,scope=image-${{ steps.ver.outputs.llama_swap }},mode=max

      - name: Publish release notes
        if: steps.ver.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.pair_tag }}
          IMAGE: ghcr.io/${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.pair_tag }}
          LS: ${{ steps.ver.outputs.ls_num }}
          PODMAN: ${{ steps.ver.outputs.podman }}
          LS_SHA: ${{ steps.ver.outputs.ls_sha256 }}
          PODMAN_SHA: ${{ steps.ver.outputs.podman_sha256 }}
        run: |
          set -euo pipefail

          # Idempotent, and deliberately non-destructive: hand-written notes are
          # richer than anything generated here, so an existing release is left
          # exactly as it is rather than overwritten on a re-run.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — leaving it alone"
            exit 0
          fi

          # "What moved" is computed against the previously latest release, not
          # from memory, so the notes answer the real question: did llama-swap
          # move, or did podman?
          PREV_TAG="$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name 2>/dev/null || true)"
          SIZE="$(docker image inspect -f '{{.Size}}' llama-swap-podman:smoke 2>/dev/null || echo 0)"

          uv run scripts/make_release_notes.py \
            --tag "$TAG" --ls "$LS" --podman "$PODMAN" \
            --ls-sha256 "$LS_SHA" --podman-sha256 "$PODMAN_SHA" \
            --image "$IMAGE" --prev-tag "$PREV_TAG" --size-bytes "$SIZE" \
            --smoke "all passed" > "$RUNNER_TEMP/release-notes.md"

          # No --verify-tag here on purpose: the watcher dispatches release mode
          # without pushing a git tag, so requiring one would fail every
          # watcher-triggered release. gh creates the tag at the commit CI
          # actually built, which is the provenance we want; on a tag-push
          # release the tag already exists and is used as-is.
          gh release create "$TAG" --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          echo "published release notes for $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Push (dev)
        if: steps.ver.outputs.mode == 'dev'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            LS_VERSION=${{ steps.ver.outputs.ls_num }}
            LS_SHA256=${{ steps.ver.outputs.ls_sha256 }}
            PODMAN_VERSION=${{ steps.ver.outputs.podman }}
            PODMAN_SHA256=${{ steps.ver.outputs.podman_sha256 }}
          tags: |
            ghcr.io/${{ steps.ver.outputs.image }}:dev
            ghcr.io/${{ steps.ver.outputs.image }}:dev-${{ steps.ver.outputs.short_sha }}
          cache-from: type=gha,scope=image-${{ steps.ver.outputs.llama_swap }}
          cache-to: type=gha,scope=image-${{ steps.ver.outputs.llama_swap }},mode=max
