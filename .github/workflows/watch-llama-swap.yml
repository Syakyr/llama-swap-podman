name: watch-llama-swap

# Watches BOTH upstreams and auto-tags <llama-swap>-podman<X.Y.Z> as the
# provenance record, then triggers build.yml:
#  - llama-swap: newest release drives the aggregator binary
#  - podman:     newest *stable* release drives the baked-in remote CLI
#    (GitHub's releases/latest excludes prereleases, so v7.0.0-rc1 style
#    tags are never picked up — verified against the podman repo).
#
# The image is no longer built on a llama-swap base image, so "resolve the
# base" means "resolve the release assets and their published checksums"
# (scripts/resolve_release.py). Both checksums are passed into the dispatch,
# so the pair recorded here is byte-for-byte the pair that gets built even if
# upstream republishes in between.
#
# A tag pushed with GITHUB_TOKEN does NOT trigger other workflows, so the
# watcher dispatches build.yml explicitly (workflow_dispatch) instead of
# relying on its own tag push.
#
# The watcher also keeps the Dockerfile ARGs and compose.yml defaults in sync
# with the newest resolved pair so bare local builds never rot. A manual run
# pinned to an older version deliberately skips that sync.
#
# Failure modes handled:
#  - Upstream repos get renamed. containers/podman moved to
#    podman-container-tools/podman; the resolver points at the current
#    names and fails loudly rather than silently building an old asset.
#  - A checksum asset disappears or changes format: the resolver exits
#    non-zero, the watcher reports it, nothing is dispatched.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      llama_swap_version:
        description: "Upstream llama-swap version (blank = newest release)"
        required: false
        default: ""
      podman_version:
        description: "Podman version to bake in (blank = newest stable release)"
        required: false
        default: ""
      force:
        description: "Rebuild even if the pairing tag already exists"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: scripts/**

      - name: Resolve upstream versions and checksums
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.llama_swap_version }}
          INPUT_PODMAN: ${{ inputs.podman_version }}
        run: |
          set -euo pipefail
          ARGS=()
          [ -n "${INPUT_VERSION:-}" ] && ARGS+=("${INPUT_VERSION}")
          if [ "${#ARGS[@]}" -gt 0 ]; then
            LS="$(uv run scripts/resolve_release.py "${ARGS[@]}" --field ls_version)"
          else
            LS="$(uv run scripts/resolve_release.py --field ls_version)"
          fi
          echo "newest upstream llama-swap: v${LS}"

          if [ -n "${INPUT_PODMAN:-}" ]; then
            PODMAN="${INPUT_PODMAN#v}"
          else
            PODMAN="$(uv run scripts/resolve_release.py "v${LS}" --field podman_version)"
          fi
          echo "newest stable podman: ${PODMAN}"

          LS_SHA="$(uv run scripts/resolve_release.py "v${LS}" "${PODMAN}" --field ls_sha256)"
          PODMAN_SHA="$(uv run scripts/resolve_release.py "v${LS}" "${PODMAN}" --field podman_sha256)"
          echo "llama-swap sha256: ${LS_SHA}"
          echo "podman sha256:     ${PODMAN_SHA}"

          {
            echo "version=v${LS}"
            echo "version_num=${LS}"
            echo "podman=${PODMAN}"
            echo "ls_sha256=${LS_SHA}"
            echo "podman_sha256=${PODMAN_SHA}"
            echo "tag=v${LS}-podman${PODMAN}"
          } >> "$GITHUB_OUTPUT"

      - name: Check if this pairing is already built
        id: state
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          IMAGE="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          TOKEN_JSON="$(curl -fsSL "https://ghcr.io/token?scope=repository:${IMAGE}:pull")"
          TOKEN="$(printf '%s' "$TOKEN_JSON" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          # GHCR returns 404 for an existing manifest if the request does not
          # advertise a manifest media type, so the Accept header is not
          # optional here — without it every tag looks unbuilt and the watcher
          # rebuilds (and overwrites) the same pairing on every tick.
          ACCEPT='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
          code="$(curl -s -o /dev/null -w '%{http_code}' -I \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: ${ACCEPT}" \
            "https://ghcr.io/v2/${IMAGE}/manifests/${TAG}")"
          if [ "$code" = "200" ]; then
            echo "image_exists=yes" >> "$GITHUB_OUTPUT"
            echo "${TAG} already exists in GHCR"
          else
            echo "image_exists=no" >> "$GITHUB_OUTPUT"
            echo "${TAG} not built yet (HTTP ${code})"
          fi

      - name: Trigger build
        if: >
          inputs.force == true ||
          steps.state.outputs.image_exists == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          PODMAN: ${{ steps.ver.outputs.podman }}
          LS_SHA: ${{ steps.ver.outputs.ls_sha256 }}
          PODMAN_SHA: ${{ steps.ver.outputs.podman_sha256 }}
        run: |
          set -euo pipefail
          echo "Dispatching build.yml for ${VERSION}-podman${PODMAN}"
          gh workflow run build.yml \
            --ref "${{ github.ref_name }}" \
            -f "llama_swap_version=${VERSION}" \
            -f "podman_version=${PODMAN}" \
            -f "ls_sha256=${LS_SHA}" \
            -f "podman_sha256=${PODMAN_SHA}" \
            -f "mode=release"

      - name: Sync Dockerfile and compose defaults
        if: >
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.llama_swap_version == '' && inputs.podman_version == '')
        run: |
          set -euo pipefail
          LS="${{ steps.ver.outputs.version_num }}"
          PODMAN="${{ steps.ver.outputs.podman }}"
          LS_SHA="${{ steps.ver.outputs.ls_sha256 }}"
          PODMAN_SHA="${{ steps.ver.outputs.podman_sha256 }}"

          sed -i -E "s|^ARG LS_VERSION=.*|ARG LS_VERSION=${LS}|" Dockerfile
          sed -i -E "s|^ARG LS_SHA256=.*|ARG LS_SHA256=${LS_SHA}|" Dockerfile
          sed -i -E "s|^ARG PODMAN_VERSION=.*|ARG PODMAN_VERSION=${PODMAN}|" Dockerfile
          sed -i -E "s|^ARG PODMAN_SHA256=.*|ARG PODMAN_SHA256=${PODMAN_SHA}|" Dockerfile
          sed -i -E "s|(LS_VERSION: \\\$\{LS_VERSION:-)v[0-9]+|\1${LS}|g" compose.yml
          sed -i -E "s|(LS_SHA256: \\\$\{LS_SHA256:-)[0-9a-f]+|\1${LS_SHA}|g" compose.yml
          sed -i -E "s|(PODMAN_VERSION: \\\$\{PODMAN_VERSION:-)[0-9.]+|\1${PODMAN}|g" compose.yml
          sed -i -E "s|(PODMAN_SHA256: \\\$\{PODMAN_SHA256:-)[0-9a-f]+|\1${PODMAN_SHA}|g" compose.yml

          if git diff --quiet Dockerfile compose.yml; then
            echo "defaults already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Dockerfile compose.yml
            git commit -m "chore: pin default upstream pair to v${LS} + podman ${PODMAN}"
            git push origin "HEAD:${{ github.ref_name }}"
            echo "synced Dockerfile + compose.yml defaults to ${LS} + podman ${PODMAN}"
          fi

      - name: Nothing to do
        if: >
          github.event_name == 'schedule' &&
          steps.state.outputs.image_exists == 'yes'
        run: echo "${{ steps.ver.outputs.tag }} is already built; nothing to do"
